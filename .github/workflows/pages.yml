name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - run: npm run build
      - name: Update Pages branch
        run: |
          git fetch origin gh-pages
          git worktree add -b gh-pages "$RUNNER_TEMP/after-632-pages" origin/gh-pages
          find "$RUNNER_TEMP/after-632-pages" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a dist/. "$RUNNER_TEMP/after-632-pages/"
          touch "$RUNNER_TEMP/after-632-pages/.nojekyll"
          git -C "$RUNNER_TEMP/after-632-pages" add -A
          if ! git -C "$RUNNER_TEMP/after-632-pages" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/after-632-pages" -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Publish site from $GITHUB_SHA"
            git -C "$RUNNER_TEMP/after-632-pages" push origin HEAD:gh-pages
          fi
